spring.application.name=api-service

# Load secrets from .env at repo root (or local .env when running from api-service/)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/shortly
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JPA and Hibernate
spring.jpa.properties.hibernate.format_sql=true

spring.profiles.active=dev
logging.level.org.flywaydb=DEBUG

base.url=http://localhost:8080

app.jwt-secret=${APP_JWT_SECRET:changeme-dev-only}
app-jwt-expiration-milliseconds=604800000

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#grpc
kgs.host=localhost
kgs.port=9090

# GeoIP — path from .env (GEOIP_DATABASE_PATH). Download: scripts/download-geolite2.ps1
geoip.database.path=${GEOIP_DATABASE_PATH:}

